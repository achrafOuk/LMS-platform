networks:
  ft_transcendence:
    driver: bridge

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: ft_transcendence_db
    networks:
      - ft_transcendence
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - lms_platform_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_local
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - lms_platform_pgadmin_data:/var/lib/pgadmin
    networks:
      - ft_transcendence
    depends_on:
      - db
  rustfs:
    image: rustfs/rustfs:latest
    container_name: communix-rustfs-dev
    restart: unless-stopped
    volumes:
      - lms_platform_rustfs_data:/data
    ports:
      - "9000:9000" # RustFS API
      - "9001:9001" # RustFS Console
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    command: ["--address", "0.0.0.0:9000", "/data"]


volumes:
  lms_platform_pgdata:
  lms_platform_pgadmin_data:
  lms_platform_rustfs_data: